<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Keamanan - Konfirmasi</title>
    <!-- Menggunakan Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi kustom untuk efek panik */
        @keyframes sirene {
            0% { background-color: #000; }
            50% { background-color: #7f1d1d; } /* Merah gelap */
            100% { background-color: #000; }
        }
        .bg-sirene {
            animation: sirene 0.5s infinite;
        }
        
        /* Menyembunyikan tampilan awal dan memunculkan yang prank */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 m-0 p-0 overflow-hidden h-screen w-screen cursor-pointer select-none" id="mainContainer" onclick="mulaiPrank()">

    <!-- Audio Element (Tersembunyi) -->
    <!-- Menggunakan URL Raw GitHub agar bisa dimainkan langsung -->
    <audio id="prankAudio" loop preload="auto">
        <source src="https://raw.githubusercontent.com/wdsaqgoldbadrustorebotz/Ikyyywow/main/desah-prank_R0qRCEYr.mp3" type="audio/mpeg">
    </audio>

    <!-- TAMPILAN AWAL (Umpan untuk diklik) -->
    <div id="tampilanAwal" class="h-full w-full flex flex-col items-center justify-center p-6 text-center transition-opacity duration-300">
        <div class="mb-8 w-24 h-24 bg-blue-500/20 rounded-full flex items-center justify-center animate-pulse">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        </div>
        
        <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">Verifikasi Pengguna</h1>
        <p class="text-slate-400 text-lg md:text-xl max-w-md mx-auto mb-10">
            Sistem mendeteksi akses baru. Silakan ketuk layar di mana saja untuk mengkonfirmasi bahwa Anda adalah manusia.
        </p>

        <div class="animate-bounce mt-4">
            <span class="inline-block bg-blue-600 text-white font-semibold py-3 px-8 rounded-full shadow-[0_0_20px_rgba(37,99,235,0.5)]">
                Ketuk Layar
            </span>
        </div>
    </div>

    <!-- TAMPILAN HASIL PRANK -->
    <div id="tampilanPrank" class="hidden h-full w-full flex-col items-center justify-center p-6 text-center z-50">
        <div class="animate-bounce mb-6">
            <span class="text-8xl drop-shadow-[0_0_30px_rgba(255,0,0,0.8)]">🚨</span>
        </div>
        
        <h1 class="text-5xl md:text-7xl font-black text-red-500 mb-2 uppercase tracking-widest drop-shadow-[0_0_10px_rgba(239,68,68,1)]">
            PANIK GAK??
        </h1>
        <p class="text-white text-2xl font-bold mb-8">
            PANIK LAH MASA ENGGAK! 🤣
        </p>

        <div class="bg-black/50 border border-red-600/50 p-4 rounded-xl mt-8 max-w-sm w-full mx-auto backdrop-blur-sm">
            <p id="volumeIndicator" class="text-red-400 font-mono text-sm uppercase tracking-wider mb-2">
                Memaksa Volume Naik... 0%
            </p>
            <!-- Progress bar merah yang akan penuh -->
            <div class="w-full bg-slate-800 rounded-full h-2.5">
                <div id="volumeBar" class="bg-red-600 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
            
            <p class="text-slate-500 text-xs mt-6">
                Silakan tutup tab browser ini jika Anda menyerah.
            </p>
        </div>
    </div>

    <script>
        let prankAktif = false;
        const audio = document.getElementById('prankAudio');
        const container = document.getElementById('mainContainer');
        const layarAwal = document.getElementById('tampilanAwal');
        const layarPrank = document.getElementById('tampilanPrank');
        const volumeIndicator = document.getElementById('volumeIndicator');
        const volumeBar = document.getElementById('volumeBar');

        function mulaiPrank() {
            // Cegah script berjalan berkali-kali jika layar di-tap lagi
            if (prankAktif) return;
            prankAktif = true;

            // 1. Ubah Tampilan UI
            layarAwal.classList.add('hidden');
            layarPrank.classList.remove('hidden');
            layarPrank.style.display = 'flex';
            container.classList.remove('bg-slate-900');
            container.classList.add('bg-sirene'); // Tambahkan animasi kedap-kedip merah hitam

            // 2. Mulai Audio dengan volume awal sangat rendah (0.1 atau 10%)
            audio.volume = 0.1; 
            
            // Coba mainkan audio
            let playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Audio diblokir oleh browser:", error);
                    volumeIndicator.innerText = "Gagal memutar audio. Harap izinkan situs.";
                });
            }

            // 3. Logika "Volume Naik Sendiri" secara bertahap (Fade In & Maximize)
            let currentVolume = 0.1;
            
            // Interval berjalan setiap 150 milidetik
            let volumeInterval = setInterval(() => {
                if (currentVolume < 1.0) {
                    // Naikkan volume sedikit demi sedikit
                    currentVolume += 0.05; 
                    
                    // Pastikan volume tidak lewat dari 1.0 (karena 1.0 adalah batas maksimal di HTML5 Audio)
                    if (currentVolume > 1.0) currentVolume = 1.0;
                    
                    audio.volume = currentVolume;
                    
                    // Update UI indikator persentase
                    let percentage = Math.round(currentVolume * 100);
                    volumeIndicator.innerText = `VOLUME DIPAKSA MAKSIMAL: ${percentage}%`;
                    volumeBar.style.width = `${percentage}%`;

                } else {
                    // Jika sudah mencapai 100%, hentikan interval
                    clearInterval(volumeInterval);
                    volumeIndicator.innerText = "VOLUME TERKUNCI 100%";
                    volumeIndicator.classList.add('text-red-500', 'font-bold', 'animate-pulse');
                    volumeBar.classList.add('bg-red-500', 'shadow-[0_0_10px_rgba(239,68,68,1)]');
                }
            }, 150); // Kecepatan kenaikan volume (150ms)
        }
    </script>
</body>
</html>
